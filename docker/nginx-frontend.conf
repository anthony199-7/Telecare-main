server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 /Telecare/;
    }

    location = /Telecare {
        return 301 /Telecare/;
    }

    location = /vite.svg {
        alias /usr/share/nginx/html/Telecare/vite.svg;
    }

    location ^~ /Telecare/ {
        try_files $uri $uri/ /Telecare/index.html;
    }
}
